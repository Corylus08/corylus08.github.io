<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bingo do Role</title>
  <style>
    :root {
      --bg:           #100a1c;
      --surface:      #1e1530;
      --surface-on:   #2e2050;
      --border:       #3a2d5a;
      --border-on:    #7c5cbf;
      --accent:       #9b6dff;
      --accent-glow:  #7c5cbf55;
      --text-title:   #e8deff;
      --text-sub:     #9585bb;
      --text-on:      #ffffff;
      --radius:       18px;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      background: var(--bg);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start; /* ← topo */
      font-family: 'Segoe UI', system-ui, sans-serif;
      gap: 2rem;
      padding: 2rem;
    }

    h1 {
      color: var(--text-title);
      font-size: 1.4rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      opacity: 0.85;
    }

    .toggle-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 1.25rem;
      width: min(100%, 420px);
    }

    .toggle-btn {
      aspect-ratio: 1 / 1;
      background: var(--surface);
      border: 2px solid var(--border);
      border-radius: var(--radius);
      cursor: pointer;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.25rem;
      padding-bottom: 2.25rem;
      transition:
        background 0.25s ease,
        border-color 0.25s ease,
        box-shadow 0.25s ease,
        transform 0.15s ease;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      outline: none;
    }

    .toggle-btn:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 3px;
    }

    .toggle-btn:active {
      transform: scale(0.96);
    }

    .toggle-btn.on {
      background: var(--surface-on);
      border-color: var(--border-on);
      box-shadow: 0 0 18px var(--accent-glow), inset 0 0 12px var(--accent-glow);
    }

    .toggle-btn.on .btn-title {
      color: var(--accent);
    }

    .toggle-btn.on .btn-sub {
      color: var(--text-on);
      opacity: 0.75;
    }

    .btn-title {
      color: var(--text-title);
      font-size: 1.05rem;
      font-weight: 800;
      letter-spacing: 0.03em;
      transition: color 0.25s ease;
      text-align: center;
    }

    .btn-sub {
      position: absolute;
      bottom: 0.75rem;
      left: 1rem;
      right: 1rem;
      color: var(--text-sub);
      font-size: 0.68rem;
      font-weight: 400;
      letter-spacing: 0.04em;
      text-align: center;
      transition: color 0.25s ease, opacity 0.25s ease;
    }

    .copy-btn {
      width: min(100%, 420px);
      height: calc((min(100vw - 4rem, 420px) / 2 - 0.625rem) / 4);
      background: var(--surface);
      border: 2px solid var(--border);
      border-radius: var(--radius);
      cursor: pointer;
      color: var(--text-title);
      font-family: inherit;
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      transition:
        background 0.25s ease,
        border-color 0.25s ease,
        box-shadow 0.25s ease,
        transform 0.15s ease;
      -webkit-tap-highlight-color: transparent;
      outline: none;
    }

    .copy-btn:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 3px;
    }

    .copy-btn:hover {
      border-color: var(--accent);
    }

    .copy-btn:active {
      transform: scale(0.98);
    }

    .copy-btn.copied {
      background: var(--surface-on);
      border-color: var(--border-on);
      box-shadow: 0 0 18px var(--accent-glow);
      color: var(--accent);
    }
  </style>
</head>
<body>

  <h1>Bingo do Role</h1>

  <div class="toggle-grid">

    <button class="toggle-btn" onclick="toggle(this)" aria-pressed="false">
      <span class="btn-title">Começou o Role</span>
      <span class="btn-sub">Todos se saúdam 🤝</span>
    </button>

    <button class="toggle-btn" onclick="toggle(this)" aria-pressed="false">
      <span class="btn-title">Relembrar passado do Christian</span>
      <span class="btn-sub">Christian bebe 🍺</span>
    </button>

    <button class="toggle-btn" onclick="toggle(this)" aria-pressed="false">
      <span class="btn-title">Falaram do Marlon</span>
      <span class="btn-sub">Quem falou 1º, bebe 🍺</span>
    </button>

    <button class="toggle-btn" onclick="toggle(this)" aria-pressed="false">
      <span class="btn-title">Falaram da Ex do Avila</span>
      <span class="btn-sub">Todos Bebem 🍺</span>
    </button>

    <button class="toggle-btn" onclick="toggle(this)" aria-pressed="false">
      <span class="btn-title">Piada com Minoria</span>
      <span class="btn-sub">Quem riu, bebe 🍺</span>
    </button>

    <button class="toggle-btn" onclick="toggle(this)" aria-pressed="false">
      <span class="btn-title">Momento Conversa Séria</span>
      <span class="btn-sub">É sério, ninguém bebe, todos refletem</span>
    </button>

  </div>

  <button class="copy-btn" onclick="copiarResultado(this)">Copiar Resultado</button>

  <script>
    function toggle(btn) {
      const isOn = btn.classList.toggle('on');
      btn.setAttribute('aria-pressed', isOn);
    }

    function copiarResultado(btn) {
      const hoje = new Date();
      const dia  = String(hoje.getDate()).padStart(2, '0');
      const mes  = String(hoje.getMonth() + 1).padStart(2, '0');
      const ano  = hoje.getFullYear();

      const botoes = document.querySelectorAll('.toggle-btn');
      const linhas = [`Bingo do Role dia ${dia}/${mes}/${ano}`, ''];

      botoes.forEach(b => {
        const titulo = b.querySelector('.btn-title').textContent.trim();
        const on     = b.classList.contains('on');
        linhas.push(`${on ? '✅' : '❌'} ${titulo}`);
      });

      navigator.clipboard.writeText(linhas.join('\n')).then(() => {
        btn.textContent = 'Copiado!';
        btn.classList.add('copied');
        setTimeout(() => {
          btn.textContent = 'Copiar Resultado';
          btn.classList.remove('copied');
        }, 2000);
      });
    }
  </script>

</body>
</html>
